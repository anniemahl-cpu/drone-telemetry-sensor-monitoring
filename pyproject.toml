[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droneguard"
version = "0.1.0"
description = "Physics-informed drone telemetry digital twin and anomaly detection platform"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "plotly>=5.18", "streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["droneguard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
